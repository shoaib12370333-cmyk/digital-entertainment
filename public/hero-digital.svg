<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Neon gamepad above a glowing digital grid">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040705" />
      <stop offset="0.55" stop-color="#0d1233" />
      <stop offset="1" stop-color="#1a1050" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0.55" />
      <stop offset="0.45" stop-color="#e11d9c" stop-opacity="0.28" />
      <stop offset="1" stop-color="#e11d9c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="100%" r="80%">
      <stop offset="0" stop-color="#e11d9c" stop-opacity="0.6" />
      <stop offset="1" stop-color="#e11d9c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ffe9" />
      <stop offset="0.5" stop-color="#39ff88" />
      <stop offset="1" stop-color="#ff4fc3" />
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0.9" />
      <stop offset="1" stop-color="#39ff88" stop-opacity="0.12" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity="0.035" />
    </pattern>
    <style>
      .spin-a { transform-origin: 1030px 400px; animation: spin 60s linear infinite; }
      .spin-b { transform-origin: 1030px 400px; animation: spin 90s linear infinite reverse; }
      .pulse { transform-origin: 1030px 400px; animation: pulse 4.5s ease-in-out infinite; }
      .node { fill: #39ff88; animation: blink 3s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .spin-a, .spin-b, .pulse, .node { animation: none; } }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <ellipse cx="1030" cy="600" rx="760" ry="330" fill="url(#sun)" />
  <circle cx="1030" cy="400" r="420" fill="url(#core)" class="pulse" />
